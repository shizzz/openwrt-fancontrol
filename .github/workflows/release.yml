name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64

          - goos: linux
            goarch: arm64
            suffix: linux-arm64

          - goos: linux
            goarch: arm
            goarm: 7
            suffix: linux-armv7

          - goos: linux
            goarch: mipsle
            gomips: softfloat
            suffix: linux-mipsel

          - goos: linux
            goarch: mips64le
            gomips64: softfloat
            suffix: linux-mips64el

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag belongs to master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag is not on master"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}
        run: |
          mkdir -p dist

          BIN=openwrt-fancontrol

          go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o "dist/${BIN}-${{ matrix.suffix }}" \
            ./cmd/fancontrol

      - name: Package
        run: |
          cd dist

          tar czf openwrt-fancontrol-${{ matrix.suffix }}.tar.gz \
            openwrt-fancontrol-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz