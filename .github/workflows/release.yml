name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64

          - goos: linux
            goarch: arm64
            suffix: linux-arm64

          - goos: linux
            goarch: arm
            goarm: 7
            suffix: linux-armv7

          - goos: linux
            goarch: mipsle
            gomips: softfloat
            suffix: linux-mipsel

          - goos: linux
            goarch: mips64le
            gomips64: softfloat
            suffix: linux-mips64el

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag belongs to main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag is not on main"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}
        run: |
          mkdir -p dist

          BIN=openwrt-fancontrol

          SHORT="${GITHUB_SHA::7}"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME} -X main.Commit=${SHORT} -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${BIN}-${{ matrix.suffix }}" \
            ./cmd/fancontrol

      - name: Package
        run: |
          cd dist

          tar czf openwrt-fancontrol-${{ matrix.suffix }}.tar.gz \
            openwrt-fancontrol-${{ matrix.suffix }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts

          sha256sum *.tar.gz | LC_ALL=C sort -k2 > SHA256SUMS

          {
            echo "# Auto-generated SHA256 checksums for OpenWrt package Makefile"
            echo "# Release: ${{ github.ref_name }}"
            echo "# Source: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
            echo ""
            for f in *.tar.gz; do
              hash=$(sha256sum "$f" | awk '{print $1}')
              suffix="${f#openwrt-fancontrol-}"
              suffix="${suffix%.tar.gz}"
              printf 'PKG_HASH_%s:=%s\n' "$suffix" "$hash"
            done
            echo ""
            echo "# OpenWrt ARCH -> release suffix mapping:"
            echo "#   aarch64  -> linux-arm64"
            echo "#   arm      -> linux-armv7"
            echo "#   mipsel   -> linux-mipsel"
            echo "#   mips64   -> linux-mips64el"
            echo "#   x86_64   -> linux-amd64"
          } > hashes.mk

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body_path: artifacts/checksums-body.md
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/hashes.mk
